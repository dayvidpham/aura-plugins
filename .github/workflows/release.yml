name: Release

# Publication half of the release ceremony, triggered by the immutable annotated
# tag that release-tag.yml pushes with the release App token.
#
# The guard job below is the enforcement point for "a release can only come from
# a merged release PR". The enforcement rests on the guard alone: it refuses any
# tag not pushed by the release App, so a hand-pushed `v*` tag produces a failed
# run and never a published release.
#
# Note what is NOT true — anyone with push access CAN create a `v*` tag and it
# WILL start this workflow. (The rule that a GITHUB_TOKEN-pushed ref does not
# trigger workflows constrains tokens, not people.) The guard is therefore the
# only thing standing between a hand-pushed tag and a published release, which
# is why it fails closed when the expected identity is unconfigured. Configure a
# tag-creation ruleset for `v*` as defence in depth — see docs/releasing.md.
#
# STATUS — this workflow has never executed on GitHub. Every job below is
# wired and locally validated (actionlint, shellcheck, the release-script
# suites, `nix flake check`, and a full local dry-run of build → produce →
# verify against a real `pasture bundle export`), but local validation proves
# syntax and logic, not runtime behaviour. Treat the first release as a
# supervised operation — see docs/releasing.md.
on:
  push:
    tags:
      - 'v*'

concurrency:
  # Never cancelled: a half-finished publication is worse than a slow one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      kind: ${{ steps.tag.outputs.kind }}
      # The DEREFERENCED tagged commit, and the only commit identity the later
      # jobs use. GITHUB_SHA is not it: for an annotated tag push it is the tag
      # object's own sha, not the commit, and nothing has proven it is what the
      # guard checked. Everything downstream — the manifest's revisions.aura,
      # the checkouts, every comparison — reads this output instead.
      commit: ${{ steps.reachable.outputs.commit }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Actor guard. The expected identity is configured as repository variables
      # rather than hardcoded, because the App's bot login and numeric id are
      # installation-specific — see docs/releasing.md for how to read them off
      # the first App-created tag. Both are public identifiers, not secrets.
      - name: Verify the tag was pushed by the release App
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_ACTOR: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          EXPECTED_ACTOR_ID: ${{ vars.RELEASE_APP_BOT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_ACTOR" ] || [ -z "$EXPECTED_ACTOR_ID" ]; then
            echo "::error::tag ${TAG} was pushed by ${RELEASE_ACTOR} (id ${RELEASE_ACTOR_ID}), but the expected release-App identity is not configured, so that actor cannot be checked. Impact: publication is refused, because an unguarded tag could publish a release that never passed the release-PR gates. Fix: set the repository variables RELEASE_APP_BOT_LOGIN and RELEASE_APP_BOT_ID to the release App's bot login and numeric id, as described in docs/releasing.md."
            exit 1
          fi
          if [ "$RELEASE_ACTOR" != "$EXPECTED_ACTOR" ] || [ "$RELEASE_ACTOR_ID" != "$EXPECTED_ACTOR_ID" ]; then
            echo "::error::tag ${TAG} was pushed by ${RELEASE_ACTOR} (id ${RELEASE_ACTOR_ID}), not the release App ${EXPECTED_ACTOR} (id ${EXPECTED_ACTOR_ID}). Impact: nothing was published; this tag did not come from the protected release-PR flow. Fix: delete the hand-pushed tag and cut the release by opening and merging a 'release(${TAG}): <summary>' pull request instead."
            exit 1
          fi
          echo "tag ${TAG} was pushed by the release App ✓"

      - name: Checkout repository (full history + tags)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # actions/checkout rewrites an annotated tag's ref to a lightweight ref
      # pointing at the peeled commit (actions/checkout#290), so the annotation
      # assert below would misread the App's annotated tag as lightweight.
      # Re-fetch the pushed tag object so every later read sees the real tag.
      - name: Restore the pushed tag object over checkout's rewrite
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Parse and classify the tag
        id: tag
        run: scripts/release/release-grammar.sh parse-tag "$TAG" >> "$GITHUB_OUTPUT"

      # An annotated tag carries author, date, and the release summary. A
      # lightweight tag carries none of that, so a release built from one has no
      # durable record of who cut it or why.
      - name: Assert the tag is annotated
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "$tag_type" != "tag" ]; then
            echo "::error::tag ${TAG} is a ${tag_type} (lightweight) tag, not an annotated tag, so it carries no tagger identity, date, or release summary. Impact: nothing was published, because the release would have no durable provenance. Fix: delete the tag and let a merged release PR mint it, which always creates an annotated tag."
            exit 1
          fi
          echo "tag ${TAG} is annotated ✓"

      # Reachability guard: refuse to publish from a commit that is not on main.
      - name: Assert the tagged commit is reachable from main
        id: reachable
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tagged="$(git rev-list -n 1 "refs/tags/${TAG}")"
          if ! git merge-base --is-ancestor "$tagged" origin/main; then
            echo "::error::tag ${TAG} points at ${tagged}, which is not an ancestor of origin/main, so the release would not be reproducible from the default branch. Impact: nothing was published. Fix: confirm main was not force-pushed after the release PR merged, then cut a fresh release from current main."
            exit 1
          fi
          # Emitted only after the assertion passes, so no later job can read a
          # commit this guard did not accept.
          echo "commit=${tagged}" >> "$GITHUB_OUTPUT"
          echo "tagged commit ${tagged} is reachable from origin/main ✓"

  # The same full gate set the release PR ran, re-run against the exact tagged
  # commit. The PR gate proves the merge candidate; this proves what was
  # actually tagged, which is what gets published.
  gates:
    name: gates (tagged commit)
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/gates.yml


  # The producer is a packager, not a builder: every one of the nine cells must
  # arrive already built, with a canonical asset basename and the exact BundleID
  # its Pasture target bundle emitted. Both come from Pasture's own
  # `bundle export` verb at the PINNED revision — nothing here re-derives an
  # identity that belongs to Pasture's target descriptors.
  #
  # This job is also the end-to-end contract gate between the two repositories:
  # it is the only place where Pasture's emitted component set meets the Aura
  # producer's strict decoder. Its success is a required condition for
  # publication, so a cross-repo contract break fails the release instead of
  # being discovered by whoever installs it.
  build-components:
    name: build aggregate components
    needs: [guard, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      pasture-revision: ${{ steps.pin.outputs.pasture_revision }}
      channel: ${{ steps.channel.outputs.channel }}
      installer-min: ${{ steps.compatibility.outputs.installer_min }}
      installer-max: ${{ steps.compatibility.outputs.installer_max }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      KIND: ${{ needs.guard.outputs.kind }}
      AURA_COMMIT: ${{ needs.guard.outputs.commit }}
      COMPONENTS_DIR: ${{ github.workspace }}/components
      AGGREGATE_DIR: ${{ github.workspace }}/aggregate
    steps:
      # Checked out BY the commit the guard dereferenced and proved reachable,
      # not by the tag ref: that same value is what the manifest records as
      # revisions.aura, so the tree built here and the identity published are
      # the one thing by construction.
      - name: Checkout the guard-proven commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.guard.outputs.commit }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # The Pasture revision is DERIVED from flake.lock, never written here, and
      # it is the same revision the producer is compiled against: the producer
      # builds against the `pasture` flake input itself, so the binary that
      # exports the component assets and the binary that packages them cannot be
      # different commits. One release binds exactly one Pasture revision by
      # construction rather than by convention.
      - name: Derive the pinned Pasture revision from flake.lock
        id: pin
        run: |
          set -euo pipefail
          # scripts/release/pinned-pasture-revision.sh asserts the node is the
          # GitHub repository this pipeline means before returning its rev, and
          # gates.yml reads it with the same script — a fork or path input
          # carries a valid-looking revision that would otherwise be stamped
          # into the manifest as though it came from dayvidpham/pasture.
          revision="$(scripts/release/pinned-pasture-revision.sh flake.lock)"
          echo "pasture_revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "::notice::building release ${TAG} against pasture ${revision}"

      # The channel is derived from the version, never configured separately: a
      # release candidate must not be publishable as a final release by editing
      # a setting.
      - name: Derive the release channel from the tag
        id: channel
        run: |
          set -euo pipefail
          case "${KIND}" in
            final) channel=final ;;
            rc)    channel=prerelease ;;
            *)
              echo "::error::the tag guard classified ${TAG} as kind \"${KIND}\", which is neither final nor rc. Impact: release ${TAG} was not built and nothing was published, because the aggregate channel could not be decided. Fix: reconcile the kind values emitted by scripts/release/release-grammar.sh with the mapping in .github/workflows/release.yml."
              exit 1
              ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Build the pinned Pasture
        id: pasture
        env:
          PASTURE_REVISION: ${{ steps.pin.outputs.pasture_revision }}
        run: |
          set -euo pipefail
          out="$(nix build "github:dayvidpham/pasture/${PASTURE_REVISION}#pasture" --no-link --print-out-paths -L)"
          binary="${out}/bin/pasture"
          test -x "$binary" || {
            echo "::error::pasture ${PASTURE_REVISION} built, but no executable was produced at ${binary}. Impact: release ${TAG} was not built and nothing was published. Fix: confirm the pinned Pasture revision still exposes a 'pasture' flake package, then re-lock the input on a release PR and cut the release again."
            exit 1
          }
          echo "binary=${binary}" >> "$GITHUB_OUTPUT"
          "$binary" --version

      # ── Installer compatibility: the producer declares the FORMAT and the
      #    MINIMUM; the CONSUMER owns the ceiling ────────────────────────────
      #
      # installer_min is the pinned Pasture's own released version: those assets
      # were composed by that installer, so the aggregate cannot honestly claim
      # a floor below it. It is asserted, not assumed — the derivation refuses a
      # development build, and the step after it proves the version names a
      # published Pasture release built from exactly the revision pinned here.
      #
      # installer_max is a DEFERRED ceiling (0.99.99), not an absent one: it
      # covers the 0.x Pasture installer line and expires the day Pasture ships
      # 1.0.0, at which point every aggregate published before then formally
      # excludes the 1.x line by that frozen numeric bound. Underneath it the
      # manifest SCHEMA remains the format guard: an installer that cannot
      # activate pasture.aggregate-release/v1 refuses the aggregate by schema,
      # which is a check it can actually make about itself. release-grammar.sh
      # also refuses to derive a floor that is not strictly below the ceiling,
      # so a pinned Pasture at or beyond 0.99.99 fails here rather than
      # publishing an inverted or collapsed range. Raising or replacing the
      # ceiling policy for 1.0.0 and beyond, and giving development builds an
      # explicit escape hatch, is tracked in the Pasture contract:
      # https://github.com/dayvidpham/pasture/issues/39
      #
      # Both bounds come out of scripts/release/release-grammar.sh, which owns
      # the released-version grammar and the ceiling constant, and whose suite
      # runs in gates.yml — the values a release freezes are not defined by a
      # regex embedded in this file.
      - name: Derive the installer compatibility range from the pinned Pasture
        id: compatibility
        env:
          PASTURE_BINARY: ${{ steps.pasture.outputs.binary }}
        run: |
          set -euo pipefail
          reported="$("$PASTURE_BINARY" --version)"
          compatibility="$(scripts/release/release-grammar.sh installer-compatibility "$reported")"
          printf '%s\n' "$compatibility" >> "$GITHUB_OUTPUT"
          echo "::notice::installer compatibility range for ${TAG} is $(printf '%s\n' "$compatibility" | sed -n 's/^installer_min=//p')..$(printf '%s\n' "$compatibility" | sed -n 's/^installer_max=//p')"

      # The floor must name a Pasture release that exists, and the pin must BE
      # that release: a binary reporting v1.2.3 from a commit that is not v1.2.3
      # would bind provenance to a revision no consumer can relate to the version
      # the manifest advertises. This is the only network assertion in the job;
      # it queries the public Pasture repository over https with no credentials.
      - name: Assert the compatibility floor is a published Pasture release
        env:
          INSTALLER_MIN: ${{ steps.compatibility.outputs.installer_min }}
          PASTURE_REVISION: ${{ steps.pin.outputs.pasture_revision }}
        run: |
          set -euo pipefail
          scripts/release/assert-pasture-release-tag.sh "${INSTALLER_MIN}" "${PASTURE_REVISION}"

      # Emits the nine canonical archives plus the aura.aggregate-components/v1
      # component set, with the digests and bundle IDs Pasture itself derived.
      - name: Export the nine component archives
        env:
          PASTURE_BINARY: ${{ steps.pasture.outputs.binary }}
        run: |
          set -euo pipefail
          # --out must not already exist; the export claims it and removes it on
          # any failure, so a partial set can never reach the producer.
          rm -rf "${COMPONENTS_DIR}"
          "$PASTURE_BINARY" bundle export --version "${VERSION}" --out "${COMPONENTS_DIR}"

      - name: Produce the immutable aggregate
        env:
          PASTURE_REVISION: ${{ steps.pin.outputs.pasture_revision }}
          INSTALLER_MIN: ${{ steps.compatibility.outputs.installer_min }}
          INSTALLER_MAX: ${{ steps.compatibility.outputs.installer_max }}
        run: |
          set -euo pipefail
          producer="$(nix build .#aggregate-release --no-link --print-out-paths -L)/bin/aura-aggregate-release"
          rm -rf "${AGGREGATE_DIR}"
          "$producer" \
            --version          "${VERSION}" \
            --installer-min    "${INSTALLER_MIN}" \
            --installer-max    "${INSTALLER_MAX}" \
            --pasture-revision "${PASTURE_REVISION}" \
            --aura-revision    "${AURA_COMMIT}" \
            --components       "${COMPONENTS_DIR}/components.json" \
            --output-dir       "${AGGREGATE_DIR}"

      # The producer verifies its own output with Pasture's typed verifier. This
      # re-checks, with independent tools, the bindings only this run knows: the
      # tag, the tagged commit, and the pinned Pasture revision.
      - name: Verify the produced aggregate against this run's identity
        env:
          PASTURE_REVISION: ${{ steps.pin.outputs.pasture_revision }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          INSTALLER_MIN: ${{ steps.compatibility.outputs.installer_min }}
          INSTALLER_MAX: ${{ steps.compatibility.outputs.installer_max }}
        run: |
          set -euo pipefail
          scripts/release/verify-aggregate-dir.sh \
            "${AGGREGATE_DIR}" "${VERSION}" "${AURA_COMMIT}" "${PASTURE_REVISION}" "${CHANNEL}" \
            "${INSTALLER_MIN}" "${INSTALLER_MAX}"

      - name: Upload the aggregate for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aggregate-${{ needs.guard.outputs.version }}
          path: ${{ github.workspace }}/aggregate
          if-no-files-found: error
          retention-days: 7
          # A re-run of this job must be able to replace its own earlier
          # upload; without this it fails on the second attempt with a name
          # conflict, in the middle of a release, for no reason that concerns
          # the release.
          overwrite: true

  # Publication is a DRAFT-FIRST, two-phase act, because a GitHub Release
  # becomes visible the moment it is created and its assets appear one upload at
  # a time. Creating it published would mean a consumer could fetch a release
  # holding three of eleven assets, and "delete the incomplete release by hand"
  # is not a recovery for something an installer may already have read.
  #
  # So: create the release as a DRAFT (invisible to consumers), upload every
  # asset, assert the API's own asset list is exactly the manifest's inventory,
  # verify a fresh download of the draft with the same verifier the build job
  # used, and only then undraft. Undrafting is a single API call over content
  # that has already been proven — the smallest irreversible step available.
  publish:
    name: publish GitHub Release
    needs: [guard, gates, build-components]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The default token stays read-only: the Release is created with the same
    # App identity that pushed the tag, so one identity owns the whole
    # publication and the actor guard's expectation stays meaningful.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      CHANNEL: ${{ needs.build-components.outputs.channel }}
      PASTURE_REVISION: ${{ needs.build-components.outputs.pasture-revision }}
      AURA_COMMIT: ${{ needs.guard.outputs.commit }}
      INSTALLER_MIN: ${{ needs.build-components.outputs.installer-min }}
      INSTALLER_MAX: ${{ needs.build-components.outputs.installer-max }}
      AGGREGATE_DIR: ${{ github.workspace }}/aggregate
      DRAFT_DIR: ${{ github.workspace }}/draft-download
      PUBLISHED_DIR: ${{ github.workspace }}/already-published
    steps:
      - name: Checkout the guard-proven commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.guard.outputs.commit }}

      - name: Assert the release App credentials are configured
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "$APP_ID" ]  || missing="${missing} RELEASE_APP_ID"
          [ -n "$APP_KEY" ] || missing="${missing} RELEASE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::release ${TAG} was built but cannot be published: missing secret(s)${missing}. Impact: no GitHub Release was created and no assets were attached; the tag and the built aggregate are unharmed. Fix: add the secret(s) under Settings → Secrets and variables → Actions as described in docs/releasing.md, then re-run this workflow from the Actions tab — the existing tag is reused, never recreated."
            exit 1
          fi

      - name: Download the built aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aggregate-${{ needs.guard.outputs.version }}
          path: ${{ github.workspace }}/aggregate

      # Re-verified HERE, after the artifact round-trip, rather than trusting the
      # build job's own check: what is published is what came out of this
      # download, so that is what has to be proven.
      - name: Verify the aggregate before publishing anything
        run: |
          set -euo pipefail
          scripts/release/verify-aggregate-dir.sh \
            "${AGGREGATE_DIR}" "${VERSION}" "${AURA_COMMIT}" "${PASTURE_REVISION}" "${CHANNEL}" \
            "${INSTALLER_MIN}" "${INSTALLER_MAX}"

      # Contents: write is needed to create the release and upload its assets.
      # The smoke job mints its own read-only token rather than sharing this one.
      - name: "Mint App token (to create the Release)"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Re-running a release is normal — an expired token, a runner failure, a
      # network fault mid-upload. What must never happen is a re-run silently
      # replacing published bytes with different ones. So the existing state is
      # classified first:
      #
      #   absent    — create the draft and upload;
      #   draft     — a previous attempt stopped before undrafting: resume, by
      #               re-uploading over it (a draft is not consumer-visible, so
      #               its bytes are not yet a promise);
      #   published — compare what is published against what this run built. If
      #               they are byte-identical the release is already correct and
      #               this run converges silently; if they differ, refuse.
      - name: Classify any existing release for this tag
        id: existing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! state="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "no release exists for ${TAG} yet ✓"
            exit 0
          fi
          if [ "$state" = "true" ]; then
            echo "state=draft" >> "$GITHUB_OUTPUT"
            echo "::notice::a DRAFT release for ${TAG} already exists — a previous attempt stopped before publication; resuming it"
          else
            echo "state=published" >> "$GITHUB_OUTPUT"
            echo "::notice::a PUBLISHED release for ${TAG} already exists — comparing it against what this run built"
          fi

      # Idempotent re-run: the published assets are downloaded and compared,
      # name for name and digest for digest, with what this run built. Equal
      # means the work is already done and the run may proceed without touching
      # anything. Unequal means two different aggregates claim one permanent
      # version, which is exactly the situation immutability exists to prevent.
      - name: Converge with, or refuse, an already-published release
        id: converge
        if: steps.existing.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          rm -rf "${PUBLISHED_DIR}"
          mkdir -p "${PUBLISHED_DIR}"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${PUBLISHED_DIR}"

          digests() { ( cd "$1" && find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | xargs -r sha256sum ); }
          if ! diff -u <(digests "${PUBLISHED_DIR}") <(digests "${AGGREGATE_DIR}") > "${RUNNER_TEMP}/asset-diff"; then
            {
              echo "::error::release ${TAG} is already published, and its assets differ from the ones this run built (diff of 'sha256  name' listings follows: published on the left, this run on the right). Impact: nothing was changed and the published release is untouched. Fix: published versions are permanent — do not attempt to replace it. Cut a new release PR with the next unused version. If the published release is genuinely broken, it must be superseded, not edited."
              sed -n '1,60p' "${RUNNER_TEMP}/asset-diff"
            } >&2
            exit 1
          fi
          echo "published release ${TAG} is byte-identical to what this run built; converging without re-uploading ✓"
          echo "converged=true" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        if: steps.existing.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Immutable aggregate plugin release \`${VERSION}\` (${CHANNEL})."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Aura commit | \`${AURA_COMMIT}\` |"
            echo "| Pasture commit | \`${PASTURE_REVISION}\` |"
            echo "| Channel | ${CHANNEL} |"
            echo
            echo "Assets are the aggregate manifest, its SHA-256 sidecar, and one archive"
            echo "for each harness/extension cell. Verify a download before installing it:"
            echo
            echo '```bash'
            echo "sha256sum --check pasture-aggregate-manifest.json.sha256"
            echo '```'
            echo
            echo "Every component digest is recorded in \`pasture-aggregate-manifest.json\`."
            echo "This version is permanent: it is never moved, overwritten, or deleted, and"
            echo "there is no moving alias — select this exact version."
          } > "$notes"

          prerelease=()
          if [ "${CHANNEL}" = "prerelease" ]; then
            prerelease=(--prerelease)
          fi

          # --draft: created invisible, undrafted only after its contents are
          #   proven, so a consumer never sees a partially uploaded release.
          # --verify-tag: refuses to create a release for a tag that does not
          #   exist, so a typo cannot cause GitHub to mint a fresh tag here —
          #   release-tag.yml is the only thing that ever creates one.
          # --latest=false: there is no moving alias in this scheme. Consumers
          #   select one exact version, and "latest" is precisely the pointer
          #   that would let them not.
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file "$notes" \
            --verify-tag \
            --draft \
            --latest=false \
            "${prerelease[@]}"
          echo "created draft release ${TAG} ✓"

      - name: Upload every asset to the draft
        if: steps.converge.outputs.converged != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find "${AGGREGATE_DIR}" -mindepth 1 -maxdepth 1 -type f | sort)
          # --clobber so resuming an interrupted attempt replaces a partial
          # asset instead of failing on the name.
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          echo "uploaded ${#assets[@]} assets to the draft ✓"

      # The upload command exiting 0 is not evidence that eleven assets are
      # attached and complete. This asks the API what it holds and compares that
      # against the manifest's own inventory — the same inventory a consumer
      # will read — before anything becomes visible.
      - name: Assert the release holds exactly the manifest's inventory
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          manifest="${AGGREGATE_DIR}/pasture-aggregate-manifest.json"
          expected="$( {
            echo pasture-aggregate-manifest.json
            echo pasture-aggregate-manifest.json.sha256
            jq -r '.components[].asset' "$manifest"
          } | sort )"
          actual="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::release ${TAG} holds assets [$(echo "$actual" | tr '\n' ' ')] but its manifest's inventory is [$(echo "$expected" | tr '\n' ' ')]. Impact: nothing was published — the release is still a draft and invisible to consumers. Fix: delete the draft release for ${TAG} from the Releases page and re-run this workflow; an asset set that disagrees with the manifest must never be undrafted."
            exit 1
          fi
          incomplete="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[] | select(.state != "uploaded") | .name')"
          if [ -n "$incomplete" ]; then
            echo "::error::release ${TAG} holds assets that GitHub has not finished storing: [$(echo "$incomplete" | tr '\n' ' ')]. Impact: nothing was published — the release is still a draft. Fix: re-run this workflow; if the same asset stalls repeatedly, delete the draft release for ${TAG} and re-run from a clean state."
            exit 1
          fi
          echo "release ${TAG} holds exactly the assets its manifest names, all uploaded ✓"

      # The consumer's experience, run against the draft: fetch the assets over
      # the network from the Release itself and verify them. This is the check
      # that used to run after publication, moved to where its verdict can still
      # prevent one.
      - name: Verify a fresh download of the draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # A new directory, never the build job's artifact: reusing those bytes
          # would prove nothing about what was uploaded.
          rm -rf "${DRAFT_DIR}"
          mkdir -p "${DRAFT_DIR}"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${DRAFT_DIR}"
          scripts/release/verify-aggregate-dir.sh \
            "${DRAFT_DIR}" "${VERSION}" "${AURA_COMMIT}" "${PASTURE_REVISION}" "${CHANNEL}" \
            "${INSTALLER_MIN}" "${INSTALLER_MAX}"

      - name: Assert the draft is classified correctly
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          is_prerelease="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq '.isPrerelease')"
          expected=false
          [ "${CHANNEL}" = "prerelease" ] && expected=true
          if [ "$is_prerelease" != "$expected" ]; then
            echo "::error::the release ${TAG} reports isPrerelease=${is_prerelease} but its aggregate manifest declares channel ${CHANNEL} (expected isPrerelease=${expected}). Impact: this run stops here; if the release is still a draft nothing is visible to consumers, and if it was already published its assets are untouched. Fix: for a draft, delete it from the Releases page and re-run this workflow so the flag is set from the manifest's channel at creation time; for a published release, correct only the prerelease flag by hand — the assets are unaffected and must not be re-uploaded."
            exit 1
          fi
          echo "release ${TAG} is classified ${CHANNEL} ✓"

      # The single irreversible step, over content that has already been proven
      # complete, correct, and correctly classified.
      - name: Publish the release
        if: steps.converge.outputs.converged != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest=false
          echo "::notice::published release ${TAG}"
          {
            echo "### Release published"
            echo
            echo "\`${TAG}\` (${CHANNEL})."
            echo
            echo "- Aura commit: \`${AURA_COMMIT}\`"
            echo "- Pasture commit: \`${PASTURE_REVISION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The publish job already downloaded and verified the release while it was a
  # draft — that is where a bad verdict can still prevent a publication. This
  # job re-does it once more AFTER undrafting, over the public release, for the
  # one thing the draft check cannot cover: that undrafting itself did not
  # change what a consumer retrieves. It is deliberately the same verifier, so a
  # difference between the two runs is a difference in the release, not in the
  # check.
  #
  # If this job fails, the release IS published. Its diagnosis says so and says
  # what to do about it, because "nothing partial is published" stops being true
  # at the moment the draft flag comes off.
  smoke:
    name: smoke (published assets)
    needs: [guard, gates, build-components, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      CHANNEL: ${{ needs.build-components.outputs.channel }}
      PASTURE_REVISION: ${{ needs.build-components.outputs.pasture-revision }}
      AURA_COMMIT: ${{ needs.guard.outputs.commit }}
      INSTALLER_MIN: ${{ needs.build-components.outputs.installer-min }}
      INSTALLER_MAX: ${{ needs.build-components.outputs.installer-max }}
      DOWNLOAD_DIR: ${{ github.workspace }}/published
    steps:
      - name: Checkout the guard-proven commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.guard.outputs.commit }}

      - name: "Mint App token (to read the Release)"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # This job only reads a release that already exists. It cannot create,
          # edit, or delete one even if something here goes wrong.
          permission-contents: read

      - name: Download the published assets fresh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # A new directory, never the build job's artifact: reusing those bytes
          # would prove nothing about what was uploaded.
          rm -rf "${DOWNLOAD_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${DOWNLOAD_DIR}"

      - name: Assert the published release is classified correctly
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          is_prerelease="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq '.isPrerelease')"
          expected=false
          [ "${CHANNEL}" = "prerelease" ] && expected=true
          if [ "$is_prerelease" != "$expected" ]; then
            echo "::error::the published release ${TAG} reports isPrerelease=${is_prerelease} but its aggregate manifest declares channel ${CHANNEL} (expected isPrerelease=${expected}). Impact: the release IS published, but installers that opt out of prereleases would see the wrong set of versions. Fix: correct the release's prerelease flag on the Releases page to match the manifest; the assets themselves are unaffected and must not be re-uploaded."
            exit 1
          fi
          echo "published release ${TAG} is classified ${CHANNEL} ✓"

      - name: Re-verify the published assets
        run: |
          set -euo pipefail
          if ! scripts/release/verify-aggregate-dir.sh \
            "${DOWNLOAD_DIR}" "${VERSION}" "${AURA_COMMIT}" "${PASTURE_REVISION}" "${CHANNEL}" \
            "${INSTALLER_MIN}" "${INSTALLER_MAX}"; then
            echo "::error::the PUBLISHED release ${TAG} does not verify, although the same assets verified as a draft moments earlier (the verifier's diagnosis is above). Impact: the release is public and consumers can already fetch it. Fix: treat it as compromised — do not attempt to edit or replace it, since a published version is permanent. Supersede it by cutting the next version, and, if a consumer may have installed from it, say so in that release's notes."
            exit 1
          fi
          {
            echo "### Published assets verified"
            echo
            echo "Downloaded \`${TAG}\` fresh from the Release and re-checked the manifest"
            echo "checksum sidecar, the identity bindings, and every component digest."
          } >> "$GITHUB_STEP_SUMMARY"
