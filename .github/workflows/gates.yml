name: Gates

# The complete aura-plugins quality gate, factored into a reusable workflow so
# that the release-PR ceremony can demand it in full REGARDLESS of which files a
# release PR happens to touch.
#
# This matters because a release PR is typically a version-marker commit that
# touches almost nothing. A path-filtered CI workflow would skip entirely on
# such a PR, producing a green tick that proves nothing right before the most
# irreversible action in the repository. release-pr.yml therefore calls this
# workflow directly rather than relying on path filters.
#
# It is `workflow_call` only: it deliberately does not register itself as a
# check on every ordinary pull request, so adding it changes no existing
# required-check configuration.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  nix:
    name: nix flake check + package builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Builds every flake check, which is where hm-module-test (the Home
      # Manager projection proof) and aggregate-release-test (the aggregate
      # producer's own Go test suite, run as part of its buildGoModule check
      # phase) actually execute. `--no-build` is NOT used here: on a release PR
      # the point is to run them, not merely to evaluate them.
      - name: nix flake check
        run: nix flake check -L

      - name: nix build .#aggregate-release
        run: nix build .#aggregate-release --no-link -L

      # Proves the producer binary is present, runnable, and still exposes the
      # seven-flag contract the publication job depends on.
      - name: Assert the aggregate producer's option contract
        run: |
          set -euo pipefail
          producer="$(nix build .#aggregate-release --no-link --print-out-paths -L)/bin/aura-aggregate-release"
          test -x "$producer" || {
            echo "::error::aura-aggregate-release was not built as an executable at ${producer}"
            exit 1
          }
          echo "$producer" > "${RUNNER_TEMP}/producer-path"
          # --help exits 0 and documents every option the publication job passes.
          help="$("$producer" --help 2>&1)"
          echo "$help"
          for option in version installer-min installer-max pasture-revision aura-revision components output-dir; do
            # Anchored so that a substring match cannot pass for a real option:
            # an unanchored "-components" would also be satisfied by a line
            # documenting some future "-extra-components".
            if ! printf '%s\n' "$help" | grep -Eq "^[[:space:]]*-${option}([[:space:]]|$)"; then
              echo "::error::the aggregate producer no longer documents --${option} as its own option; the release publication job passes it and would fail at tag time. Reconcile .github/workflows/release.yml with aggregate-release/main.go."
              exit 1
            fi
          done

      # The version grammar in scripts/release/release-grammar.sh and the
      # producer's own artifact.ParseVersion are two independent parsers that
      # must agree, or a release PR passes its gate, mints a PERMANENT tag, and
      # only then fails when the producer refuses the version. This step proves
      # the subset relation — everything the grammar accepts, the producer
      # accepts — against the real binary rather than by inspection.
      #
      # Acceptance is asserted indirectly and deliberately: the producer is
      # invoked with a component set that does not exist, so a version it
      # accepts must fail LATER, at the component-set stage. Reaching that stage
      # is proof the version itself parsed.
      - name: Assert the producer accepts every version the grammar accepts
        env:
          # Any syntactically valid revision; these runs never reach the point
          # where revision contents matter.
          PLACEHOLDER_REVISION: '0000000000000000000000000000000000000000'
        run: |
          set -euo pipefail
          producer="$(cat "${RUNNER_TEMP}/producer-path")"
          # Representative accepted versions: final, rc, multi-digit, the zero
          # version, and the widest numerics the grammar allows. Kept in step
          # with scripts/release/release-grammar_test.sh.
          versions=(
            0.0.0
            0.1.0
            1.2.3
            0.1.0-rc1
            10.20.30-rc42
            99999999999999999.0.0
            0.1.0-rc99999999999999999
          )
          for version in "${versions[@]}"; do
            # Guard the guard: if the grammar ever stops accepting one of these,
            # this loop is silently testing nothing.
            scripts/release/release-grammar.sh parse-tag "v${version}" > /dev/null

            set +e
            output="$("$producer" \
              --version          "$version" \
              --installer-min    0.0.0 \
              --installer-max    "$version" \
              --pasture-revision "$PLACEHOLDER_REVISION" \
              --aura-revision    "$PLACEHOLDER_REVISION" \
              --components       "${RUNNER_TEMP}/does-not-exist/components.json" \
              --output-dir       "${RUNNER_TEMP}/unused-${version}" 2>&1)"
            set -e

            if printf '%s\n' "$output" | grep -q 'parsing aggregate version'; then
              echo "::error::the release grammar accepts version ${version} but the aggregate producer rejects it. Impact: a release PR carrying this version would pass its gate, mint a permanent tag, and only then fail to build. Fix: reconcile the pattern in scripts/release/release-grammar.sh with artifact.ParseVersion, and pin the corrected edge in scripts/release/release-grammar_test.sh. Producer said: ${output}"
              exit 1
            fi
            if ! printf '%s\n' "$output" | grep -q 'reading the component set'; then
              echo "::error::probing version ${version} did not reach the component-set stage, so this check can no longer prove the producer accepted the version. Impact: the grammar-versus-producer agreement is now unverified. Fix: the producer's option order or error wording changed — update this step in .github/workflows/gates.yml to match aggregate-release/main.go. Producer said: ${output}"
              exit 1
            fi
            echo "producer accepts ${version} ✓"
          done

      - name: nix build .#aura-swarm
        run: nix build .#aura-swarm --no-link -L

      - name: nix run .#aura-swarm -- --help
        run: nix run .#aura-swarm -- --help

  release-scripts:
    name: release helper scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: shellcheck the release helpers
        run: shellcheck scripts/release/*.sh

      # Exercises the real scripts/release/release-grammar.sh — the same entry
      # point release-pr.yml, release-tag.yml, and release.yml invoke — so the
      # version grammar cannot drift from what the workflows enforce.
      - name: Test the release version grammar
        run: scripts/release/release-grammar_test.sh

      # The publish and smoke jobs refuse to publish, or declare a published
      # release broken, on this script's say-so. Its own suite therefore runs in
      # the same gate rather than only by hand.
      - name: Test the aggregate directory verifier
        run: scripts/release/verify-aggregate-dir_test.sh

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: actionlint
        run: nix run nixpkgs#actionlint -- -color
