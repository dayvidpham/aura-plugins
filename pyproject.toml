[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-swarm"
version = "0.10.2"
description = "Worktree and tmux launcher for Aura/Pasture multi-agent workflows"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[tool.setuptools]
script-files = ["bin/aura-swarm"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["aura_protocol*"]
